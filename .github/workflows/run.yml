name: Update Carbon Data

on:
  schedule:
    - cron: '0 * * * *' # Runs automatically every hour
  workflow_dispatch: # Allows you to run it manually

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install required packages
        run: pip install -r requirements.txt

      - name: Run data collection script
        run: python collector.py backfill

      - name: Save updated database back to GitHub
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add carbon.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated carbon data update" && git push)
          

          
